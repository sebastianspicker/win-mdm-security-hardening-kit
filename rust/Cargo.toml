[workspace]
resolver = "2"
members = [
  "apps/baselineops-cli",
  "apps/baselineops-gui",
  "apps/baselineops-worker",
  "crates/baselineops-capabilities",
  "crates/baselineops-domain",
  "crates/baselineops-engine",
  "crates/baselineops-windows",
  "xtask",
]

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sebastianspicker/baseline-ops"
authors = ["Sebastian Spicker"]

[workspace.dependencies]
anyhow = "=1.0.103"
baselineops-capabilities = { version = "=3.0.0-alpha.1", path = "crates/baselineops-capabilities" }
baselineops-domain = { version = "=3.0.0-alpha.1", path = "crates/baselineops-domain" }
baselineops-engine = { version = "=3.0.0-alpha.1", path = "crates/baselineops-engine" }
baselineops-windows = { version = "=3.0.0-alpha.1", path = "crates/baselineops-windows" }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "=4.5.51", features = ["derive"] }
csv = "=1.4.0"
hex = "=0.4.3"
schemars = { version = "=1.0.4", features = ["chrono04", "uuid1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
windows = "=0.62.2"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
