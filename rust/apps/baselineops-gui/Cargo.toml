[package]
name = "baselineops-gui"
description = "Native BaselineOps v3 Windows launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "baselineops-gui"
path = "src/main.rs"

[dependencies]
baselineops-capabilities.workspace = true
baselineops-domain.workspace = true
baselineops-engine.workspace = true
baselineops-windows.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
