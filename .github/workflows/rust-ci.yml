# Verifies the portable and Windows-specific contracts for the additive Rust v3 workspace.
name: Rust v3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'

permissions: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable contracts and tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Verify workspace
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features
          cargo run -p xtask -- verify

      - name: Verify dependency advisories, licenses, bans, and sources
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check

  windows-x64:
    name: Windows x64 compile and contract tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Build and test Windows boundary
        working-directory: rust
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --workspace --all-features --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc `
            -p baselineops-cli -p baselineops-gui -p baselineops-worker
