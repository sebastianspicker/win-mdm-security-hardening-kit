# Builds a gated, signed Rust v3 package only from an exact rust-v* release tag.
name: Rust v3 signed release

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-package:
    name: Build, sign, and verify x64 package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
      commit: ${{ steps.release_ref.outputs.commit }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve exact Rust release tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -cne 'tag') {
            throw 'Manual release runs must be dispatched from the tag being packaged.'
          }
          $tag = $env:GITHUB_REF_NAME
          if ($tag.Length -gt 132 -or $tag -cnotmatch '^rust-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Invalid Rust release tag: $tag"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=baselineops-windows-$tag-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout resolved release commit
        id: release_ref
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Release tag was not fetched: $env:RELEASE_TAG" }
          $commit = (git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          if ($commit -cne $env:GITHUB_SHA) { throw "Tag commit $commit differs from event commit $env:GITHUB_SHA" }
          git checkout --detach $commit
          if ((git rev-parse HEAD).Trim() -cne $commit) { throw 'Detached HEAD does not match release commit.' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require signing configuration
        env:
          SIGN_CERTIFICATE_BASE64: ${{ secrets.RUST_SIGN_CERTIFICATE_BASE64 }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.RUST_SIGN_CERTIFICATE_PASSWORD }}
          EXPECTED_SIGNER_SUBJECT: ${{ secrets.RUST_EXPECTED_SIGNER_SUBJECT }}
          EXPECTED_SIGNER_SPKI_SHA256: ${{ secrets.RUST_EXPECTED_SIGNER_SPKI_SHA256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'SIGN_CERTIFICATE_BASE64','SIGN_CERTIFICATE_PASSWORD','EXPECTED_SIGNER_SUBJECT','EXPECTED_SIGNER_SPKI_SHA256') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Publication requires secret $name."
            }
          }

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Locate pinned Windows SDK SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = '10.0.26100.0'
          $signTool = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin\$sdkVersion\x64\signtool.exe"
          if (-not (Test-Path -LiteralPath $signTool -PathType Leaf)) {
            throw "Pinned Windows SDK SignTool is unavailable: $signTool"
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($signTool).FileVersion
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^10\.0\.26100\.0') {
            throw "Pinned SignTool version preflight failed: $signTool reports $version"
          }
          "SIGNTOOL_PATH=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and build release binaries
        env:
          BASELINEOPS_EXPECTED_SIGNER_SUBJECT: ${{ secrets.RUST_EXPECTED_SIGNER_SUBJECT }}
          BASELINEOPS_EXPECTED_SIGNER_SPKI_SHA256: ${{ secrets.RUST_EXPECTED_SIGNER_SPKI_SHA256 }}
        working-directory: rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --workspace --all-features --target x86_64-pc-windows-msvc
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
          cargo run -p xtask -- generate
          cargo run -p xtask -- release-check `
            --expected-signer $env:BASELINEOPS_EXPECTED_SIGNER_SUBJECT `
            --expected-signer-spki-sha256 $env:BASELINEOPS_EXPECTED_SIGNER_SPKI_SHA256 `
            --release-tag $env:GITHUB_REF_NAME
          cargo build --locked --release --target x86_64-pc-windows-msvc `
            -p baselineops-cli -p baselineops-gui -p baselineops-worker

      - name: Sign staged executables and detached manifest
        env:
          SIGN_CERTIFICATE_BASE64: ${{ secrets.RUST_SIGN_CERTIFICATE_BASE64 }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.RUST_SIGN_CERTIFICATE_PASSWORD }}
          EXPECTED_SIGNER_SUBJECT: ${{ secrets.RUST_EXPECTED_SIGNER_SUBJECT }}
          EXPECTED_SIGNER_SPKI_SHA256: ${{ secrets.RUST_EXPECTED_SIGNER_SPKI_SHA256 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = Join-Path $env:RUNNER_TEMP 'baselineops-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGN_CERTIFICATE_BASE64))
          try {
            $bin = Join-Path $env:GITHUB_WORKSPACE 'rust\target\x86_64-pc-windows-msvc\release'
            foreach ($name in 'baselineops.exe','baselineops-gui.exe','baselineops-worker.exe') {
              & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:SIGN_CERTIFICATE_PASSWORD (Join-Path $bin $name)
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $name" }
            }
            $stage = Join-Path $env:GITHUB_WORKSPACE 'rust\dist\stage'
            cargo run --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'rust\Cargo.toml') -p xtask -- package-stage --target x86_64-pc-windows-msvc --output $stage --expected-signer $env:EXPECTED_SIGNER_SUBJECT --expected-signer-spki-sha256 $env:EXPECTED_SIGNER_SPKI_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'package staging failed' }
            $manifest = Join-Path $stage 'manifest.json'
            & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:SIGN_CERTIFICATE_PASSWORD /p7 $stage /p7ce DetachedSignedData /p7co 1.2.840.113549.1.7.1 $manifest
            if ($LASTEXITCODE -ne 0) { throw 'signtool detached manifest signing failed' }
            $detachedSignature = Join-Path $stage 'manifest.json.p7'
            if (-not (Test-Path -LiteralPath $detachedSignature -PathType Leaf)) { throw 'SignTool did not produce manifest.json.p7' }
            & $env:SIGNTOOL_PATH timestamp /tr http://timestamp.digicert.com /td SHA256 /p7 $detachedSignature
            if ($LASTEXITCODE -ne 0) { throw 'signtool detached manifest timestamping failed' }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signer and package
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ secrets.RUST_EXPECTED_SIGNER_SUBJECT }}
          EXPECTED_SIGNER_SPKI_SHA256: ${{ secrets.RUST_EXPECTED_SIGNER_SPKI_SHA256 }}
          BASELINEOPS_EXPECTED_SIGNER_SUBJECT: ${{ secrets.RUST_EXPECTED_SIGNER_SUBJECT }}
          BASELINEOPS_EXPECTED_SIGNER_SPKI_SHA256: ${{ secrets.RUST_EXPECTED_SIGNER_SPKI_SHA256 }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_COMMIT: ${{ steps.release_ref.outputs.commit }}
        working-directory: rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C .. rev-parse HEAD).Trim() -cne $env:RELEASE_COMMIT) { throw 'Refusing to package a different commit.' }
          $bin = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release'
          foreach ($name in 'baselineops.exe','baselineops-gui.exe','baselineops-worker.exe') {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $bin $name)
            if ($signature.Status -ne 'Valid') { throw "$name is not validly signed: $($signature.Status)" }
            if ($signature.SignerCertificate.Subject -cne $env:EXPECTED_SIGNER_SUBJECT) {
              throw "$name has unexpected signer $($signature.SignerCertificate.Subject)"
            }
          }
          cargo run -p xtask -- package-finalize --stage (Join-Path $PWD 'dist\stage') --output (Join-Path $PWD "dist\$env:RELEASE_ASSET")
          cargo run -p xtask -- package-verify --package (Join-Path $PWD "dist\$env:RELEASE_ASSET") --expected-signer $env:EXPECTED_SIGNER_SUBJECT --expected-signer-spki-sha256 $env:EXPECTED_SIGNER_SPKI_SHA256

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-v3-release
          path: |
            rust/dist/*.zip
            rust/dist/*.sha256
            rust/dist/*.manifest.json
          if-no-files-found: error

  publish:
    name: Publish immutable Rust release
    needs: build-sign-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-v3-release
          path: dist

      - name: Refuse mutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-sign-package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Attest package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'dist/**'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-sign-package.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/** --verify-tag --generate-notes "${prerelease[@]}"
