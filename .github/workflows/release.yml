# Verifies a tag with the exact pinned toolchain, packages only the reviewed
# public surface, and publishes checksums and build provenance for alpha assets.
name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_package:
    name: Verify and package release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      asset: ${{ steps.release.outputs.asset }}
      commit: ${{ steps.release_ref.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      # SHA-256 value published with the official PowerShell v7.6.3 release.
      POWERSHELL_VERSION: '7.6.3'
      POWERSHELL_LINUX_X64_SHA256: '856d0765d2332377f9d7a4aea76efdfde4de51446e7738dde2dfda41dba9e2a7'
      PESTER_VERSION: '5.8.0'
      PSSCRIPTANALYZER_VERSION: '1.25.0'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo 'Manual release runs must be dispatched from the tag being packaged.' >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          valid_tag=true
          if (( ${#tag} > 127 )) ||
            [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            valid_tag=false
          elif [[ "${tag}" == *-* ]]; then
            prerelease="${tag#*-}"
            IFS='.' read -r -a identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" != "0" && "${identifier}" == 0* ]]; then
                valid_tag=false
                break
              fi
            done
          fi
          if [[ "${valid_tag}" != true ]]; then
            printf 'Invalid release tag: %s\n' "${tag}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          asset="baselineops-windows-${tag}.zip"
          printf 'asset=%s\n' "${asset}" >> "${GITHUB_OUTPUT}"

      - name: Checkout resolved release tag
        id: release_ref
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            printf 'Release tag was not fetched by checkout: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          release_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${release_commit}" != "${GITHUB_SHA}" ]]; then
            printf 'Resolved tag commit %s does not match event commit %s.\n' "${release_commit}" "${GITHUB_SHA}" >&2
            exit 1
          fi
          git checkout --detach "${release_commit}"
          if [[ "$(git rev-parse HEAD)" != "${release_commit}" ]]; then
            echo 'Checked-out HEAD does not match the resolved release tag commit.' >&2
            exit 1
          fi
          printf 'commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install checksum-pinned PowerShell 7.6.3
        uses: ./.github/actions/setup-pinned-pwsh-linux
        with:
          version: ${{ env.POWERSHELL_VERSION }}
          linux-x64-sha256: ${{ env.POWERSHELL_LINUX_X64_SHA256 }}

      - name: Install verification prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly."
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($module in @(
              @{ Name = 'Pester'; Version = $env:PESTER_VERSION; SkipPublisherCheck = $true },
              @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSCRIPTANALYZER_VERSION; SkipPublisherCheck = $false }
            )) {
            $installed = Get-Module -ListAvailable -Name $module.Name |
              Where-Object Version -eq $module.Version |
              Select-Object -First 1
            if (-not $installed) {
              $parameters = @{
                Name            = $module.Name
                RequiredVersion = $module.Version
                Scope           = 'CurrentUser'
                Force           = $true
              }
              if ($module.SkipPublisherCheck) {
                $parameters.SkipPublisherCheck = $true
              }
              Install-Module @parameters
            }
            Import-Module $module.Name -RequiredVersion $module.Version -Force
            $loadedVersion = (Get-Module -Name $module.Name).Version.ToString()
            if ($loadedVersion -cne $module.Version) {
              throw "Expected $($module.Name) $($module.Version), loaded $loadedVersion."
            }
          }

      - name: Run release static gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly."
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          ./tools/secret-scan.ps1 -RootPath $env:GITHUB_WORKSPACE
          ./tools/Test-Documentation.ps1 -RootPath $env:GITHUB_WORKSPACE
          ./tools/verify.ps1 -RootPath $env:GITHUB_WORKSPACE

      - name: Run release Pester suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly."
          }
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: Build package
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          RELEASE_COMMIT: ${{ steps.release_ref.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" ]]; then
            echo 'Refusing to archive a HEAD other than the resolved release tag commit.' >&2
            exit 1
          fi
          mkdir -p dist
          git archive \
            --format=zip \
            --output="dist/${RELEASE_ASSET}" \
            "${RELEASE_COMMIT}" \
            README.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md PSScriptAnalyzerSettings.psd1 \
            docs examples lib scripts tools \
            ':(exclude)scripts/ci-local.sh'

      - name: Generate portable checksum
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${RELEASE_ASSET}" > "${RELEASE_ASSET}.sha256"
          sha256sum -c "${RELEASE_ASSET}.sha256"

      - name: Generate and verify package manifest
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          trap 'rm -rf "${package_root}"' EXIT
          unzip -q "dist/${RELEASE_ASSET}" -d "${package_root}"
          (
            cd "${package_root}"
            unexpected_entry="$(find . ! -type d ! -type f -print -quit)"
            if [[ -n "${unexpected_entry}" ]]; then
              printf 'Package contains a non-regular entry: %s\n' "${unexpected_entry}" >&2
              exit 1
            fi
            find . -type f -print0 |
              sort -z |
              xargs -0 sha256sum > "${GITHUB_WORKSPACE}/dist/${RELEASE_ASSET}.manifest.sha256"
            sha256sum -c "${GITHUB_WORKSPACE}/dist/${RELEASE_ASSET}.manifest.sha256"
          )

      - name: Verify package inventory
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          trap 'rm -rf "${package_root}"' EXIT
          unzip -q "dist/${RELEASE_ASSET}" -d "${package_root}"

          for prohibited in \
            .agents .codex .github \
            private tests RELEASE_STATUS.md scripts/ci-local.sh; do
            if [[ -e "${package_root}/${prohibited}" ]]; then
              printf 'Prohibited release path: %s\n' "${prohibited}" >&2
              exit 1
            fi
          done
          if find "${package_root}" -type d -name private -print -quit | grep -q .; then
            echo 'Prohibited private directory found in release package.' >&2
            exit 1
          fi

          numbered_count="$(find "${package_root}/scripts" -maxdepth 1 -type f -name '[0-9][0-9]-*.ps1' ! -name '00-*' | wc -l | tr -d ' ')"
          orchestration_count="$(find "${package_root}/scripts" -maxdepth 1 -type f -name '00-*.ps1' | wc -l | tr -d ' ')"
          profile_count="$(find "${package_root}/examples/profiles" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          config_count="$(find "${package_root}/examples/configs" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          [[ "${numbered_count}" == 52 ]]
          [[ "${orchestration_count}" == 6 ]]
          [[ "${profile_count}" == 7 ]]
          [[ "${config_count}" == 4 ]]

          for required in \
            docs/alpha-release.md \
            docs/launcher-gui.md \
            tools/Launcher-GUI.ps1 \
            tools/Launcher-Worker.ps1 \
            tools/Launcher.Core.psm1; do
            test -f "${package_root}/${required}"
          done

      - name: Run extracted operator-package gates
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          trap 'rm -rf "${package_root}"' EXIT
          unzip -q "dist/${RELEASE_ASSET}" -d "${package_root}"
          actual_version="$(pwsh -NoLogo -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()")"
          if [[ "${actual_version}" != "${POWERSHELL_VERSION}" ]]; then
            printf 'Expected PowerShell %s exactly, got %s.\n' "${POWERSHELL_VERSION}" "${actual_version}" >&2
            exit 1
          fi
          pwsh -NoProfile -File "${package_root}/scripts/00-Validate-Profile.ps1" \
            -ProfilePath "${package_root}/examples/profiles/baseline-audit.json" \
            -RootPath "${package_root}"
          set +e
          pwsh -NoProfile -File "${package_root}/scripts/00-Run-Profile.ps1" \
            -ProfilePath "${package_root}/examples/profiles/baseline-audit.json" \
            -RootPath "${package_root}" \
            -Mode Audit -OutputFormat None -Confirm:false
          profile_status=$?
          set -e
          if [[ "${profile_status}" != 0 && "${profile_status}" != 2 ]]; then
            printf 'Extracted baseline profile failed with exit code %s.\n' "${profile_status}" >&2
            exit 1
          fi
          pwsh -NoProfile -File "${package_root}/tools/secret-scan.ps1" \
            -RootPath "${package_root}"
          pwsh -NoProfile -File "${package_root}/tools/Test-Documentation.ps1" \
            -RootPath "${package_root}"
          pwsh -NoProfile -Command \
            "Import-Module PSScriptAnalyzer -RequiredVersion '${PSSCRIPTANALYZER_VERSION}' -Force; & '${package_root}/tools/verify.ps1' -RootPath '${package_root}'"

      - name: Upload verified candidate
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ steps.release.outputs.tag }}
          path: |
            dist/${{ steps.release.outputs.asset }}
            dist/${{ steps.release.outputs.asset }}.sha256
            dist/${{ steps.release.outputs.asset }}.manifest.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and publish release
    needs: verify_package
    runs-on: ubuntu-latest
    environment:
      name: alpha-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    env:
      RELEASE_ASSET: ${{ needs.verify_package.outputs.asset }}
      RELEASE_COMMIT: ${{ needs.verify_package.outputs.commit }}
      RELEASE_TAG: ${{ needs.verify_package.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.verify_package.outputs.tag }}
          path: dist

      - name: Verify downloaded candidate
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "${RELEASE_ASSET}"
            "${RELEASE_ASSET}.sha256"
            "${RELEASE_ASSET}.manifest.sha256"
          )
          mapfile -d '' downloaded < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if (( ${#downloaded[@]} != ${#expected[@]} )); then
            printf 'Expected %s candidate files, found %s.\n' "${#expected[@]}" "${#downloaded[@]}" >&2
            exit 1
          fi
          for file in "${expected[@]}"; do
            test -s "dist/${file}"
          done
          (cd dist && sha256sum -c "${RELEASE_ASSET}.sha256")

      - name: Verify remote release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object | [.type, .sha] | @tsv'
          )
          depth=0
          while [[ "${object_type}" == tag ]]; do
            depth=$((depth + 1))
            if (( depth > 5 )); then
              echo 'Refusing an annotated tag chain deeper than five objects.' >&2
              exit 1
            fi
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '.object | [.type, .sha] | @tsv'
            )
          done
          if [[ "${object_type}" != commit || "${object_sha}" != "${RELEASE_COMMIT}" ]]; then
            printf 'Remote tag does not resolve to the verified commit %s.\n' "${RELEASE_COMMIT}" >&2
            exit 1
          fi

      - name: Require immutable release setting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'The alpha-release environment must provide RELEASE_SETTINGS_READ_TOKEN.' >&2
            exit 1
          fi
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')"
          if [[ "${enabled}" != true ]]; then
            echo 'GitHub immutable releases must be enabled before publication.' >&2
            exit 1
          fi

      - name: Attest package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/${{ needs.verify_package.outputs.asset }}

      - name: Download attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [[ -e "${RELEASE_ASSET}.intoto.jsonl" ]]; then
            echo 'Refusing to overwrite an existing named attestation bundle.' >&2
            exit 1
          fi
          gh attestation download \
            "${RELEASE_ASSET}" \
            --repo "${GITHUB_REPOSITORY}"
          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("${bundle}")
          done < <(find . -maxdepth 1 -type f \( -name 'sha256:*.jsonl' -o -name 'sha256-*.jsonl' \) -print0)
          if (( ${#bundles[@]} != 1 )); then
            printf 'Expected exactly one downloaded attestation bundle, found %s.\n' "${#bundles[@]}" >&2
            exit 1
          fi
          if [[ ! -s "${bundles[0]}" ]]; then
            echo 'Downloaded attestation bundle is empty.' >&2
            exit 1
          fi
          mv -- "${bundles[0]}" "${RELEASE_ASSET}.intoto.jsonl"
          test -s "${RELEASE_ASSET}.intoto.jsonl"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_release="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isImmutable,isPrerelease,tagName 2>/dev/null)"; then
            printf 'Refusing pre-existing GitHub release for %s: %s\n' "${RELEASE_TAG}" "${existing_release}" >&2
            exit 1
          fi

          release_notes="$(cat <<EOF
          Source commit: \`${RELEASE_COMMIT}\`

          BaselineOps for Windows alpha includes 52 endpoint scripts, six orchestration and reporting entry points, seven profiles, four script-specific configuration examples, and the partially validated Windows Forms launcher.

          Known limitations:

          - The source scripts are not Authenticode-signed.
          - The launcher form has not completed manual keyboard, accessibility, High Contrast, or DPI validation. No launcher screenshot is supplied.
          - Live endpoint remediation, rollback, and failure injection have not completed release validation.
          - Native Windows validation remains a release requirement; it is not established by this packaging workflow.

          Migration note: this alpha does not migrate identifiers from the previous project name. Install it in a new versioned directory.

          Scope and installation: https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/alpha-release.md
          EOF
          )"
          arguments=(
            release create "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "BaselineOps for Windows ${RELEASE_TAG}"
            --notes "${release_notes}"
            --generate-notes
            --draft
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"

      - name: Refuse mutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          for asset in \
            "${RELEASE_ASSET}" \
            "${RELEASE_ASSET}.sha256" \
            "${RELEASE_ASSET}.manifest.sha256" \
            "${RELEASE_ASSET}.intoto.jsonl"; do
            if grep -Fqx -- "${asset}" <<< "${existing_assets}"; then
              printf 'Refusing to replace existing release asset: %s\n' "${asset}" >&2
              exit 1
            fi
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${RELEASE_ASSET}" \
            "dist/${RELEASE_ASSET}.sha256" \
            "dist/${RELEASE_ASSET}.manifest.sha256" \
            "dist/${RELEASE_ASSET}.intoto.jsonl" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Reverify remote release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object | [.type, .sha] | @tsv'
          )
          depth=0
          while [[ "${object_type}" == tag ]]; do
            depth=$((depth + 1))
            if (( depth > 5 )); then
              echo 'Refusing an annotated tag chain deeper than five objects.' >&2
              exit 1
            fi
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '.object | [.type, .sha] | @tsv'
            )
          done
          if [[ "${object_type}" != commit || "${object_sha}" != "${RELEASE_COMMIT}" ]]; then
            printf 'Remote tag moved away from verified commit %s.\n' "${RELEASE_COMMIT}" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify published release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_prerelease=false
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            expected_prerelease=true
          fi
          for _ in 1 2 3 4 5; do
            read -r is_draft is_immutable is_prerelease tag_name < <(
              gh release view "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json isDraft,isImmutable,isPrerelease,tagName \
                --jq '[.isDraft, .isImmutable, .isPrerelease, .tagName] | @tsv'
            )
            if [[ "${is_draft}" == false && "${is_immutable}" == true ]]; then
              break
            fi
            sleep 2
          done
          [[ "${is_draft}" == false ]]
          [[ "${is_immutable}" == true ]]
          [[ "${is_prerelease}" == "${expected_prerelease}" ]]
          [[ "${tag_name}" == "${RELEASE_TAG}" ]]
