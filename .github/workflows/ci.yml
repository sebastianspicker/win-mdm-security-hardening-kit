# Runs the pinned cross-platform PowerShell verification contract used to decide
# whether a change is safe to merge into the alpha release line.
name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
      - 'update-*'
      - 'update/**'
  pull_request:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 values are published with the official PowerShell v7.6.3 release.
  POWERSHELL_VERSION: '7.6.3'
  POWERSHELL_LINUX_X64_SHA256: '856d0765d2332377f9d7a4aea76efdfde4de51446e7738dde2dfda41dba9e2a7'
  POWERSHELL_WINDOWS_X64_SHA256: '07ddb0d00b660459560ef82a9841da7705b27cd5dcca5a0d7b025a98eca29eca'
  PESTER_VERSION: '5.8.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  verify:
    name: ${{ matrix.check_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_id: core-7.6.3
            check_name: Static checks
            edition: Core
          - runtime_id: windows-powershell-5.1
            check_name: Static checks (Windows PowerShell 5.1)
            edition: Desktop
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-${{ matrix.runtime_id }}-psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Install checksum-pinned PowerShell 7.6.3
        if: matrix.edition == 'Core'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $asset = "PowerShell-$env:POWERSHELL_VERSION-win-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $installRoot = Join-Path $env:RUNNER_TEMP "powershell-$env:POWERSHELL_VERSION"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$env:POWERSHELL_VERSION/$asset"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:POWERSHELL_WINDOWS_X64_SHA256) {
            throw "PowerShell archive hash mismatch. Expected $env:POWERSHELL_WINDOWS_X64_SHA256, got $actualHash."
          }
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $executable = Join-Path $installRoot 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "PowerShell executable was not extracted: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Windows PowerShell 5.1
        if: matrix.edition == 'Desktop'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $PSHOME 'powershell.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows PowerShell executable was not found: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify selected PowerShell runtime
        env:
          EXPECTED_EDITION: ${{ matrix.edition }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identityJson = & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command @'
          [pscustomobject]@{
            Version = $PSVersionTable.PSVersion.ToString()
            Major = $PSVersionTable.PSVersion.Major
            Minor = $PSVersionTable.PSVersion.Minor
            Edition = $PSVersionTable.PSEdition
          } | ConvertTo-Json -Compress
          '@
          if ($LASTEXITCODE -ne 0) { throw 'The selected PowerShell runtime could not be queried.' }
          $identity = $identityJson | ConvertFrom-Json
          if ($identity.Edition -cne $env:EXPECTED_EDITION) {
            throw "Expected PowerShell edition $env:EXPECTED_EDITION, got $($identity.Edition)."
          }
          if ($env:EXPECTED_EDITION -eq 'Core' -and $identity.Version -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly, got $($identity.Version)."
          }
          if ($env:EXPECTED_EDITION -eq 'Desktop' -and
              ($identity.Major -ne 5 -or $identity.Minor -ne 1)) {
            throw "Expected Windows PowerShell 5.1, got $($identity.Version)."
          }
          "Using $($identity.Edition) $($identity.Version) at $env:POWERSHELL_EXE"

      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @'
          $ErrorActionPreference = 'Stop'
          $version = $env:PSSCRIPTANALYZER_VERSION
          $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer |
            Where-Object Version -eq $version |
            Select-Object -First 1
          if ($null -eq $installed) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $version -Force
          $loadedVersion = (Get-Module -Name PSScriptAnalyzer).Version.ToString()
          if ($loadedVersion -cne $version) {
            throw "Expected PSScriptAnalyzer $version, loaded $loadedVersion."
          }
          '@
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Secret scan (basic)
        shell: powershell
        run: |
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\secret-scan.ps1 -RootPath $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Static checks
        shell: powershell
        run: |
          $verification = @'
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/verify.ps1') -RootPath $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE
          '@
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-windows:
    name: ${{ matrix.check_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_id: core-7.6.3
            check_name: Pester (Windows)
            artifact_name: test-results
            edition: Core
          - runtime_id: windows-powershell-5.1
            check_name: Pester (Windows PowerShell 5.1)
            artifact_name: test-results-windows-powershell-5.1
            edition: Desktop
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-${{ matrix.runtime_id }}-pester-${{ env.PESTER_VERSION }}

      - name: Install checksum-pinned PowerShell 7.6.3
        if: matrix.edition == 'Core'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $asset = "PowerShell-$env:POWERSHELL_VERSION-win-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $installRoot = Join-Path $env:RUNNER_TEMP "powershell-$env:POWERSHELL_VERSION"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$env:POWERSHELL_VERSION/$asset"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:POWERSHELL_WINDOWS_X64_SHA256) {
            throw "PowerShell archive hash mismatch. Expected $env:POWERSHELL_WINDOWS_X64_SHA256, got $actualHash."
          }
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $executable = Join-Path $installRoot 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "PowerShell executable was not extracted: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Select Windows PowerShell 5.1
        if: matrix.edition == 'Desktop'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = Join-Path $PSHOME 'powershell.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows PowerShell executable was not found: $executable"
          }
          "POWERSHELL_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify selected PowerShell runtime
        env:
          EXPECTED_EDITION: ${{ matrix.edition }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identityJson = & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command @'
          [pscustomobject]@{
            Version = $PSVersionTable.PSVersion.ToString()
            Major = $PSVersionTable.PSVersion.Major
            Minor = $PSVersionTable.PSVersion.Minor
            Edition = $PSVersionTable.PSEdition
          } | ConvertTo-Json -Compress
          '@
          if ($LASTEXITCODE -ne 0) { throw 'The selected PowerShell runtime could not be queried.' }
          $identity = $identityJson | ConvertFrom-Json
          if ($identity.Edition -cne $env:EXPECTED_EDITION) {
            throw "Expected PowerShell edition $env:EXPECTED_EDITION, got $($identity.Edition)."
          }
          if ($env:EXPECTED_EDITION -eq 'Core' -and $identity.Version -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly, got $($identity.Version)."
          }
          if ($env:EXPECTED_EDITION -eq 'Desktop' -and
              ($identity.Major -ne 5 -or $identity.Minor -ne 1)) {
            throw "Expected Windows PowerShell 5.1, got $($identity.Version)."
          }
          "Using $($identity.Edition) $($identity.Version) at $env:POWERSHELL_EXE"

      - name: Ensure Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @'
          $ErrorActionPreference = 'Stop'
          $version = $env:PESTER_VERSION
          $installed = Get-Module -ListAvailable -Name Pester |
            Where-Object Version -eq $version |
            Select-Object -First 1
          if ($null -eq $installed) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion $version -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion $version -Force
          $loadedVersion = (Get-Module -Name Pester).Version.ToString()
          if ($loadedVersion -cne $version) {
            throw "Expected Pester $version, loaded $loadedVersion."
          }
          '@
          & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Pester in a trusted Windows workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedRoot = Join-Path $env:ProgramData "BaselineOpsCi-$env:GITHUB_RUN_ID-${{ matrix.runtime_id }}"
          $trustedWorkspace = Join-Path $trustedRoot 'workspace'
          $testTemp = Join-Path $trustedRoot 'temp'
          $runnerScript = Join-Path $trustedRoot 'run-pester.ps1'
          $pesterDestination = Join-Path $trustedRoot 'Pester'
          $runtimeDestination = Join-Path $trustedRoot 'PowerShell'
          $taskName = "BaselineOpsCi-$env:GITHUB_RUN_ID-${{ matrix.runtime_id }}"
          $pesterJson = & $env:POWERSHELL_EXE -NoLogo -NoProfile -Command @'
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object Version -eq $env:PESTER_VERSION |
            Select-Object -First 1
          if ($null -eq $pester) {
            throw "Pester $env:PESTER_VERSION is unavailable."
          }
          [pscustomobject]@{
            ModuleBase = $pester.ModuleBase
            Version = $pester.Version.ToString()
          } | ConvertTo-Json -Compress
          '@
          if ($LASTEXITCODE -ne 0) { throw "Pester $env:PESTER_VERSION could not be resolved." }
          $pester = $pesterJson | ConvertFrom-Json
          if ($pester.Version -cne $env:PESTER_VERSION) {
            throw "Expected Pester $env:PESTER_VERSION, resolved $($pester.Version)."
          }

          New-Item -Path $trustedRoot, $testTemp -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $trustedWorkspace -Recurse -Force
          Copy-Item -LiteralPath $pester.ModuleBase -Destination $pesterDestination -Recurse -Force
          $taskExecutable = $env:POWERSHELL_EXE
          if ('${{ matrix.edition }}' -eq 'Core') {
            $runtimeSource = Split-Path -Parent $env:POWERSHELL_EXE
            Copy-Item -LiteralPath $runtimeSource -Destination $runtimeDestination -Recurse -Force
            $taskExecutable = Join-Path $runtimeDestination 'pwsh.exe'
          }
          @"
          `$ErrorActionPreference = 'Stop'
          `$env:TEMP = '$testTemp'
          `$env:TMP = '$testTemp'
          if ('${{ matrix.edition }}' -eq 'Core' -and
              `$PSVersionTable.PSVersion.ToString() -cne '$env:POWERSHELL_VERSION') {
            throw 'The trusted task did not start in PowerShell $env:POWERSHELL_VERSION.'
          }
          if ('${{ matrix.edition }}' -eq 'Desktop' -and
              (`$PSVersionTable.PSVersion.Major -ne 5 -or `$PSVersionTable.PSVersion.Minor -ne 1)) {
            throw 'The trusted task did not start in Windows PowerShell 5.1.'
          }
          Import-Module '$pesterDestination\Pester.psd1' -Force
          Set-Location '$trustedWorkspace'
          `$configuration = New-PesterConfiguration
          `$configuration.Run.Path = '.\tests'
          `$configuration.Run.PassThru = `$true
          `$configuration.Output.Verbosity = 'Detailed'
          `$configuration.Output.CIFormat = 'GithubActions'
          `$configuration.TestResult.Enabled = `$true
          `$configuration.TestResult.OutputPath = 'testResults.xml'
          if (Get-Variable -Name PSStyle -ErrorAction SilentlyContinue) {
            `$PSStyle.OutputRendering = 'PlainText'
          }
          `$result = Invoke-Pester -Configuration `$configuration
          if (`$null -eq `$result) {
            throw 'Pester did not return a result.'
          }
          if (-not (Test-Path -LiteralPath 'testResults.xml' -PathType Leaf)) {
            throw 'Pester did not create testResults.xml.'
          }
          try {
            `$testResults = [xml](Get-Content -LiteralPath 'testResults.xml' -Raw -ErrorAction Stop)
          } catch {
            throw "Pester produced invalid testResults.xml: `$(`$_.Exception.Message)"
          }
          if (`$null -eq `$testResults.'test-results') {
            throw 'Pester testResults.xml does not contain test-results.'
          }
          `$failedCount = [int]`$result.FailedCount
          exit [Math]::Min([Math]::Max(`$failedCount, 0), 255)
          "@ | Set-Content -LiteralPath $runnerScript -Encoding utf8

          $administrators = New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $system = New-Object Security.Principal.SecurityIdentifier('S-1-5-18')
          $runner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          $items = @(
            Get-Item -LiteralPath $trustedRoot -Force
            Get-Item -LiteralPath $trustedWorkspace -Force
            Get-Item -LiteralPath $testTemp -Force
            Get-Item -LiteralPath $runnerScript -Force
            Get-ChildItem -LiteralPath $trustedRoot -Recurse -Force
          ) |
            Sort-Object { $_.FullName.Length } -Descending
          foreach ($item in $items) {
            $isDirectory = $item -is [System.IO.DirectoryInfo]
            $security = if ($isDirectory) {
              New-Object Security.AccessControl.DirectorySecurity
            } else {
              New-Object Security.AccessControl.FileSecurity
            }
            $security.SetOwner($administrators)
            $security.SetAccessRuleProtection($true, $false)
            $itemInheritance = if ($isDirectory) {
              $inheritance
            } else {
              [Security.AccessControl.InheritanceFlags]::None
            }
            foreach ($sid in @($administrators, $system)) {
              [void]$security.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
                    $sid,
                    [Security.AccessControl.FileSystemRights]::FullControl,
                    $itemInheritance,
                    [Security.AccessControl.PropagationFlags]::None,
                    [Security.AccessControl.AccessControlType]::Allow)))
            }
            [void]$security.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
                  $runner,
                  [Security.AccessControl.FileSystemRights]::ReadAndExecute,
                  $itemInheritance,
                  [Security.AccessControl.PropagationFlags]::None,
                  [Security.AccessControl.AccessControlType]::Allow)))
            Set-Acl -LiteralPath $item.FullName -AclObject $security -ErrorAction Stop
          }

          $trustedSids = @{
            'S-1-5-18' = $true
            'S-1-5-32-544' = $true
            'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464' = $true
          }
          $writeCapabilities = @(
            [Security.AccessControl.FileSystemRights]::WriteData
            [Security.AccessControl.FileSystemRights]::AppendData
            [Security.AccessControl.FileSystemRights]::WriteAttributes
            [Security.AccessControl.FileSystemRights]::WriteExtendedAttributes
            [Security.AccessControl.FileSystemRights]::Delete
            [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles
            [Security.AccessControl.FileSystemRights]::ChangePermissions
            [Security.AccessControl.FileSystemRights]::TakeOwnership
          )
          $ancestorReplacementCapabilities = @(
            [Security.AccessControl.FileSystemRights]::Delete
            [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles
            [Security.AccessControl.FileSystemRights]::ChangePermissions
            [Security.AccessControl.FileSystemRights]::TakeOwnership
          )
          function Assert-TrustedCiTaskPath {
            param([Parameter(Mandatory)][string]$Path)

            $current = (Get-Item -LiteralPath $Path -Force -ErrorAction Stop).FullName
            $isProtectedItem = $true
            while (-not [string]::IsNullOrWhiteSpace($current)) {
              $currentItem = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              if (($currentItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Trusted CI task path contains a reparse point: $current"
              }
              $acl = Get-Acl -LiteralPath $currentItem.FullName -ErrorAction Stop
              $ownerSid = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
              if (-not $trustedSids.ContainsKey($ownerSid)) {
                throw "Trusted CI task path has an untrusted owner SID '$ownerSid': $current"
              }
              $effectiveCapabilities = if ($isProtectedItem) { $writeCapabilities } else { $ancestorReplacementCapabilities }
              foreach ($rule in @($acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))) {
                if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
                if (($rule.PropagationFlags -band [Security.AccessControl.PropagationFlags]::InheritOnly) -ne 0) { continue }
                $sid = [string]$rule.IdentityReference.Value
                $hasDangerousRights = $false
                foreach ($capability in $effectiveCapabilities) {
                  if (([int64]$rule.FileSystemRights -band [int64]$capability) -eq [int64]$capability) {
                    $hasDangerousRights = $true
                    break
                  }
                }
                if (-not $trustedSids.ContainsKey($sid) -and
                    $hasDangerousRights) {
                  Write-Host "Untrusted CI task ACL: SID '$sid'; identity '$($rule.IdentityReference)'; rights '$($rule.FileSystemRights)'; path '$current'."
                  throw "Trusted CI task path grants write/replace rights to untrusted SID '$sid': $current"
                }
              }
              if ($isProtectedItem -and -not $acl.AreAccessRulesProtected) {
                throw "Trusted CI task path ACL inherits permissions: $current"
              }
              $parent = Split-Path -Parent $currentItem.FullName
              if ([string]::IsNullOrWhiteSpace($parent) -or
                  [string]::Equals($parent, $currentItem.FullName, [StringComparison]::OrdinalIgnoreCase)) { break }
              $current = $parent
              $isProtectedItem = $false
            }
          }
          Assert-TrustedCiTaskPath -Path $trustedWorkspace
          Assert-TrustedCiTaskPath -Path $runnerScript
          Assert-TrustedCiTaskPath -Path $taskExecutable
          Assert-TrustedCiTaskPath -Path $pesterDestination

          $action = New-ScheduledTaskAction -Execute $taskExecutable `
            -Argument "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$runnerScript`""
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 10)
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            Start-ScheduledTask -TaskName $taskName
            $deadline = [DateTime]::UtcNow.AddMinutes(8)
            do {
              Start-Sleep -Seconds 1
              $task = Get-ScheduledTask -TaskName $taskName
              $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName
            } while (
              [DateTime]::UtcNow -lt $deadline -and
              ($task.State -eq 'Running' -or $taskInfo.LastRunTime.Year -le 1)
            )
            if ($task.State -eq 'Running' -or $taskInfo.LastRunTime.Year -le 1) {
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              throw 'The SYSTEM Pester task did not finish within eight minutes.'
            }
            $resultPath = Join-Path $trustedWorkspace 'testResults.xml'
            if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
              Copy-Item -LiteralPath $resultPath -Destination (Join-Path $env:GITHUB_WORKSPACE 'testResults.xml') -Force
            }
            if ($taskInfo.LastTaskResult -ne 0) {
              $copiedResultPath = Join-Path $env:GITHUB_WORKSPACE 'testResults.xml'
              if (Test-Path -LiteralPath $copiedResultPath -PathType Leaf) {
                try {
                  $testResults = [xml](Get-Content -LiteralPath $copiedResultPath -Raw -ErrorAction Stop)
                } catch {
                  throw "The SYSTEM Pester task produced invalid testResults.xml: $($_.Exception.Message)"
                }
                if ($null -eq $testResults.'test-results') {
                  throw 'The SYSTEM Pester task testResults.xml does not contain test-results.'
                }
                foreach ($testCase in @($testResults.SelectNodes('//test-case[@result="Failure"]'))) {
                  $failureMessage = $testCase.SelectSingleNode('./failure/message')
                  $message = if ($null -eq $failureMessage) { '(no failure message)' } else { $failureMessage.InnerText }
                  Write-Host ("SYSTEM Pester failure: {0}`n{1}" -f $testCase.name, $message)
                }
              }
              throw "The SYSTEM Pester task failed with exit code $($taskInfo.LastTaskResult)."
            }
          } finally {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: testResults.xml
          if-no-files-found: warn

      - name: Test summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path testResults.xml) {
            $xml = [xml](Get-Content -LiteralPath testResults.xml -Raw -ErrorAction Stop)
            $root = $xml.'test-results'
            if ($null -eq $root) { throw 'testResults.xml does not contain test-results.' }
            function Get-TestResultValue {
              param([string]$Name)
              $value = $root.$Name
              if ($null -eq $value -or $value -eq '') { return '0' }
              return [string]$value
            }
            $total = Get-TestResultValue 'total'
            $passed = Get-TestResultValue 'passed'
            $failed = Get-TestResultValue 'failures'
            $skipped = Get-TestResultValue 'skipped'
            $inconclusive = Get-TestResultValue 'inconclusive'
            $notRun = Get-TestResultValue 'not-run'
            "## Test Results`n| Metric | Count |`n|--------|-------|`n| Passed | $passed |`n| Failed | $failed |`n| Skipped | $skipped |`n| Inconclusive | $inconclusive |`n| Not run | $notRun |`n| Total | $total |" >> $env:GITHUB_STEP_SUMMARY
          }

  test-smoke-linux:
    # Smoke test on Linux: runs parse-only checks (no PSScriptAnalyzer) to
    # verify scripts are syntactically valid cross-platform.
    name: Smoke (Linux, PowerShell 7.6.3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install checksum-pinned PowerShell 7.6.3
        uses: ./.github/actions/setup-pinned-pwsh-linux
        with:
          version: ${{ env.POWERSHELL_VERSION }}
          linux-x64-sha256: ${{ env.POWERSHELL_LINUX_X64_SHA256 }}

      - name: Parse checks
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -cne $env:POWERSHELL_VERSION) {
            throw "Expected PowerShell $env:POWERSHELL_VERSION exactly."
          }
          ./tools/verify.ps1 -RootPath $PWD -SkipAnalyzer
