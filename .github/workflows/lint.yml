# Validates shell, YAML, Markdown, and workflow syntax before platform-specific
# PowerShell jobs consume repository metadata.
name: Lint (shell/yaml/markdown/actions)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
      - 'update-*'
      - 'update/**'
  pull_request:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shell/yaml/markdown/actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax and analysis
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci-local.sh
          shellcheck scripts/ci-local.sh

      - name: YAML and Actions metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            "${workflow_files[@]}" \
            .github/dependabot.yml \
            .github/release.yml \
            .github/ISSUE_TEMPLATE/config.yml
          ruby <<'RUBY'
          failures = []
          Dir['.github/workflows/*.{yml,yaml}'].sort.each do |path|
            File.foreach(path).with_index(1) do |line, line_number|
              match = line.match(/^\s*uses:\s*([^\s#]+)(?:\s+#.*)?$/)
              next unless match
              action = match[1]
              next if action.start_with?('./')
              reference = action.rpartition('@').last
              unless reference.match?(/\A[0-9a-f]{40}\z/)
                failures << "#{path}:#{line_number}: external action is not pinned to a full commit SHA: #{action}"
              end
            end
          end
          abort failures.join("\n") unless failures.empty?
          RUBY

      - name: GitHub Actions semantic validation
        env:
          ACTIONLINT_VERSION: '1.7.12'
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$(mktemp -d)"
          trap 'rm -rf "${tool_root}"' EXIT
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksums="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location \
            --output "${tool_root}/${archive}" "${release_url}/${archive}"
          curl --fail --silent --show-error --location \
            --output "${tool_root}/${checksums}" "${release_url}/${checksums}"
          (
            cd "${tool_root}"
            grep -F "  ${archive}" "${checksums}" > selected-checksum.txt
            sha256sum --check selected-checksum.txt
            tar -xzf "${archive}" actionlint
          )
          "${tool_root}/actionlint" -color

      - name: Markdown links and image descriptions
        shell: pwsh
        run: ./tools/Test-Documentation.ps1 -RootPath $env:GITHUB_WORKSPACE

      - name: Whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- .
